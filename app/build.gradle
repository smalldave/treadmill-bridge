plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getVersionName = {
    // CI passes -PVERSION=x.y.z; locally falls back to git describe
    def version = project.findProperty("VERSION")
    if (version) return version

    try {
        def process = "git describe --tags --always".execute()
        process.waitFor()
        def desc = process.text.trim().replaceFirst("^v", "")
        return desc ?: "0.0.0"
    } catch (Exception e) {
        return "0.0.0"
    }
}

def getVersionCode = { String versionName ->
    def match = (versionName =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (match) {
        return match[0][1].toInteger() * 10000 + match[0][2].toInteger() * 100 + match[0][3].toInteger()
    }
    return 1
}

def appVersionName = getVersionName()
def appVersionCode = getVersionCode(appVersionName)

android {
    namespace 'com.treadmill.bridge'
    compileSdk 33

    defaultConfig {
        applicationId "com.treadmill.bridge"
        minSdk 24
        targetSdk 33
        versionCode appVersionCode
        versionName appVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def versionSuffix = variant.buildType.name == "release" ? "" : "-${variant.buildType.name}"
            outputFileName = "treadmill-bridge-${appVersionName}${versionSuffix}.apk"
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
}

tasks.withType(Test) {
    useJUnitPlatform()
}
